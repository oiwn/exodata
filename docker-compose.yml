version: '3.8'

services:
  exodata:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: exodata
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /app/data:/app/data:ro
      - ./content/systems:/app/content/systems:ro
    environment:
      - RUST_LOG=info
    # Uncomment to see more detailed logs
    # environment:
    #   - RUST_LOG=debug
