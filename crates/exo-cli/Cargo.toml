[package]
name = "exodata"
version = "0.1.1"
edition = "2024"
description = "Terminal client for Exoplanets Catalog data, SQL queries, schemas, downloads, and insights"
license = "AGPL-3.0-only"
repository = "https://github.com/oiwn/exodata"
homepage = "https://exodata.space"
readme = "README.md"
keywords = ["exoplanets", "astronomy", "nasa", "catalog", "cli"]
categories = ["command-line-utilities", "science"]

[lib]
name = "exo_cli"
path = "src/lib.rs"

[[bin]]
name = "exodata"
path = "src/main.rs"

[dependencies]
exo-core = { package = "exodata-core", version = "0.2.0", path = "../exo-core" }
exo-types = { package = "exodata-types", version = "0.1.0", path = "../exo-types" }
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2"
indicatif = "0.18"
anyhow = "1.0"
csv = "1.3"
dirs = "6.0"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
polars = { workspace = true }
votable = "0.7"

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
rand = "0.9"
serde_json = { workspace = true }
