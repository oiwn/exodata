[package]
name = "exo-cli"
version = "0.1.0"
edition = "2024"
description = "Terminal client for Exoplanets Catalog data, SQL queries, schemas, downloads, and insights"
license = "AGPL-3.0-only"
repository = "https://github.com/oiwn/exoplanets-catalog"
homepage = "https://exodata.space"

[lib]
name = "exo_cli"
path = "src/lib.rs"

[[bin]]
name = "exodata"
path = "src/main.rs"

[dependencies]
exo-core = { version = "0.1.0", path = "../exo-core" }
exo-types = { version = "0.1.0", path = "../exo-types" }
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2"
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = "0.28"
indicatif = "0.18"
anyhow = "1.0"
csv = "1.3"
dirs = "6.0"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
polars = { version = "0.53", features = ["lazy", "temporal", "timezones", "parquet", "sql"] }
votable = "0.7"

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
rand = "0.9"
serde_json = "1"
