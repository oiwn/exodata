[package]
name = "exo-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "exo"
path = "src/main.rs"

[dependencies]
exo-core = { path = "../exo-core" }
clap = { version = "4.5.52", features = ["derive"] }
comfy-table = "7.2.1"
ratatui = { version = "0.29.0", features = ["all-widgets"] }
crossterm = "0.28"
indicatif = "0.18.3"
anyhow = "1.0.100"
polars = { version = "0.52.0", features = ["lazy", "temporal", "timezones", "parquet"] }
