[package]
name = "exo-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "exo"
path = "src/main.rs"

[dependencies]
exo-core = { path = "../exo-core" }
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2"
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = "0.28"
indicatif = "0.18"
anyhow = "1.0"
polars = { version = "0.53", features = ["lazy", "temporal", "timezones", "parquet", "sql"] }
votable = "0.7"

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
rand = "0.9"
serde_json = "1"
