[package]
name = "exodata"
version = "0.1.1"
edition = "2024"
description = "Terminal client for Exoplanets Catalog data, SQL queries, schemas, downloads, and insights"
license = "AGPL-3.0-only"
repository = "https://github.com/oiwn/exodata"
homepage = "https://exodata.space"
readme = "README.md"
keywords = ["exoplanets", "astronomy", "nasa", "catalog", "cli"]
categories = ["command-line-utilities", "science"]

[lib]
name = "exo_cli"
path = "src/lib.rs"

[[bin]]
name = "exodata"
path = "src/main.rs"

[dependencies]
exo-core = { package = "exodata-core", version = "0.2.0", path = "../exo-core" }
exo-types = { package = "exodata-types", version = "0.1.0", path = "../exo-types" }
clap = { version = "4.6.6", features = ["derive"] }
comfy-table = "8.0.0"
indicatif = "0.18.6"
anyhow = "1.0.104"
csv = "1.4.0"
dirs = "6.0.0"
reqwest = { version = "0.13.4", features = ["blocking", "json", "query", "rustls"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
polars = { workspace = true }
votable = "0.7.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rand = "0.10.2"
serde_json = { workspace = true }
