[package]
name = "exodata-core"
version = "0.2.0"
edition = "2024"
description = "Core data loading, metadata, insight, and table logic for Exoplanets Catalog"
license = "AGPL-3.0-only"
repository = "https://github.com/oiwn/exoplanets-catalog"
homepage = "https://exodata.space"

[lib]
name = "exo_core"
path = "src/lib.rs"

[dependencies]
exo-types = { package = "exodata-types", version = "0.1.0", path = "../exo-types" }
polars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
toml = { workspace = true }
