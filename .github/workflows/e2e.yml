name: E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  EXO_DATA_DIR: end2end/runtime-data

jobs:
  playwright:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos

      - name: Install Tailwind CSS
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: end2end/package-lock.json

      - name: Install E2E dependencies
        working-directory: end2end
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare E2E fixtures
        working-directory: end2end
        run: npm run prepare-fixtures

      - name: Run Playwright smoke tests
        run: cargo leptos end-to-end --split

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: end2end/playwright-report/
          if-no-files-found: warn
          retention-days: 7
