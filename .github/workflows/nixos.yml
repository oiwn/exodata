name: NixOS baseline

# Runs on version tags (git tag v0.4.2 && git push origin v0.4.2) or manually:
# gh workflow run nixos.yml --ref dev. Never deploys; deploy is `just nix-deploy`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: cachix/install-nix-action@v31
      # Pulls from and pushes every built path to exodata.cachix.org.
      - uses: cachix/cachix-action@v17
        with:
          name: exodata
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Evaluate pinned configuration
        run: nix flake check --no-build --no-update-lock-file
      - name: Build application
        run: nix build .#exodata --no-link --print-out-paths --print-build-logs --keep-going --no-update-lock-file
      - name: Build host (no activation)
        run: nix build .#nixosConfigurations.exodata-vps.config.system.build.toplevel --no-link --print-out-paths --no-update-lock-file
