[package]
name = "exoplanets-catalog"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    "backend",
    "frontend",
]

[dependencies]
clap = { version = "4.5.7", features = ["derive"] }
csv = "1.3.0"
serde = "1.0.203"
backend = { path = "backend" }
frontend = { path = "frontend" }
