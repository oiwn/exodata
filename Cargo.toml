[package]
name = "exoplanets-catalog"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    "backend",
    "frontend",
]

[dependencies]
console_error_panic_hook = "0.1.7"
csv = "1.3.0"
leptos = { version = "0.6.12", features = ["csr"] }
serde = "1.0.203"
serde_json = "1.0.117"
