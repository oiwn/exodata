---
- name: Upload Data Files
  hosts: exodata
  become: yes

  vars_files:
    - ../inventory/group_vars/all.yml

  tasks:
    - name: Ensure data directory exists
      ansible.builtin.file:
        path: "{{ data_path }}"
        state: directory
        mode: '0755'

    - name: Find local data files
      ansible.builtin.find:
        paths: "{{ local_data_path }}"
        patterns:
          - "*.parquet"
          - "*.toml"
      delegate_to: localhost
      become: no
      register: local_files

    - name: Upload data files
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ data_path }}/{{ item.path | basename }}"
        mode: '0644'
      loop: "{{ local_files.files }}"

    - name: List uploaded files
      ansible.builtin.find:
        paths: "{{ data_path }}"
        patterns:
          - "*.parquet"
          - "*.toml"
      register: data_files

    - name: Display uploaded files
      ansible.builtin.debug:
        msg: "Uploaded {{ data_files.matched }} data files (parquet + metadata)"
