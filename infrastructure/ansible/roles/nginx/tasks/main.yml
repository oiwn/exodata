---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Check if SSL certificate exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  register: ssl_cert

- name: Deploy Nginx site configuration
  ansible.builtin.template:
    src: exodata.conf.j2
    dest: /etc/nginx/sites-available/exodata
    mode: '0644'
  vars:
    ssl_enabled: "{{ ssl_cert.stat.exists }}"
  notify: Reload Nginx

- name: Enable site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/exodata
    dest: /etc/nginx/sites-enabled/exodata
    state: link
  notify: Reload Nginx

- name: Remove legacy Nginx site
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/exoplanets
    - /etc/nginx/sites-available/exoplanets
  notify: Reload Nginx

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Ensure Nginx is running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: yes
