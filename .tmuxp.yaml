session_name: exodata
shell_command_before: "export RUST_LOG=info; clear"
windows:
  - window_name: code
    focus: true
    start-directory: ./
    panes:
      - shell_command:
        - hx
  - window_name: agents
    start-directory: ./
    panes:
      - shell_command:
        - herdr --session exodata
  - window_name: cmd
    start-directory: ./
    panes:
      - shell_command:
        - eza --long
  - window_name: cmd2
    panes:
      - shell_command:
        - eza --long
  - window_name: yazi
    panes:
      - shell_command:
        - yazi
