]
silent_constraints = [
    "Only system, star, planets, publishable_comparisons, and guide supply article content; source is audit context.",
    "These constraints and diagnostics are silent instructions, never reader-facing prose.",
    "Missing measurements are unknown. Do not infer composition, density, habitability, orbital spacing, orbital speed, or observing feasibility.",
    "Use only approved comparisons. Do not calculate new ratios or rank masses; preserve minimum-mass provenance and upper/lower limits.",
    "Catalog system counts can include other hosts. Describe only the planets explicitly associated with this hostname; name order is not orbital order.",
]

[request]
coverage = "Introduce the host, name its associated planets, and select useful supplied measurements. Preserve all qualifiers. Do not recite every number or force a generic ending."
format = "A factual Markdown title and connected paragraphs; no tables or bullet lists"
target_words = "300–600; shorter when needed to avoid repetition or unsupported claims"
task = "Describe this stellar host and its associated planets for curious general readers."

[guide]
limits = "Upper and lower limits are reported bounds, not exact values. An estimate is approximate."
units = "Earth radii compare radius, not volume; Earth masses compare mass. Solar masses and radii compare stellar mass and radius with the Sun. A Jupiter mass is about 317.8 Earth masses. A light-year is a unit of distance."
year = "An orbital period is the time a planet takes to complete one orbit: its year."

[source]
evidence_file = "evidence.json"
distance_conversion = "parsecs * 3.26156 = light-years"
selection = "Fullest stellar-host summary row and unique default planet rows; spectral type may be taken from any host row"

