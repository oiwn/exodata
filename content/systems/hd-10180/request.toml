    "Among the listed planets, HD 10180 c has the shortest year by reported estimates (about 5.76 days).",
    "Among the listed planets, HD 10180 h has the longest year by reported estimates (about 2210 days).",
    "Among the listed planets, HD 10180 d has the second-shortest year by reported estimates (about 16.4 days).",
    "Among the listed planets, HD 10180 g has the second-longest year by reported estimates (about 605 days).",
