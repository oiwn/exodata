display = "about 4020 K"
error_plus = 105.3
error_minus = -117.64

[[planets]]
name = "Kepler-16 b"
discovery_method = "Transit"
discovery_year = 2011

[planets.measurements.mass]
source_field = "pl_bmasse"
value = 105.833
unit = "Earth masses"
qualifier = "estimate"
display = "planet mass (not a minimum-mass quantity): about 106 Earth masses"
error_plus = 5.085
error_minus = -5.085
provenance = "Mass"

